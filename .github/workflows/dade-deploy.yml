name: Dade Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover | deploy"
        required: true
        default: "discover"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Deploy files
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -e
          mkdir -p payload/admin
          printf '%s' '' | base64 -d > payload/event-register.php
          printf '%s' '' | base64 -d > payload/admin/cleanup-registrations.php

          echo "local checksums:"
          sha256sum payload/event-register.php payload/admin/cleanup-registrations.php
          test "$(sha256sum payload/event-register.php | cut -d' ' -f1)" = "571829fa54410eb7d873dbae61272d96dc98048f35625b967b4570fa570dd926"
          test "$(sha256sum payload/admin/cleanup-registrations.php | cut -d' ' -f1)" = "18fb7448fcf54603d48a739a2f778512c5495454dfe43b3359353f824960a7fb"

          TS=$(date +%Y%m%d_%H%M%S)
          ssh target "mkdir -p ~/public_html/admin; cp -a ~/public_html/event-register.php ~/public_html/event-register.php.bak_$TS 2>/dev/null || true; cp -a ~/public_html/admin/cleanup-registrations.php ~/public_html/admin/cleanup-registrations.php.bak_$TS 2>/dev/null || true"
          scp -q payload/event-register.php target:~/public_html/event-register.php
          scp -q payload/admin/cleanup-registrations.php target:~/public_html/admin/cleanup-registrations.php

          echo "remote checksums:"
          ssh target "sha256sum ~/public_html/event-register.php ~/public_html/admin/cleanup-registrations.php; ls -l ~/public_html/event-register.php ~/public_html/admin/cleanup-registrations.php"
